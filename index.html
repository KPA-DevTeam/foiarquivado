<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>lala</title>

    <meta property="og:title" content="aray mo" />
    <meta property="og:description" content="pakak" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0033cc">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        body {
            /* "Snowish" white background */
            background-color: #fffafa; 
            color: #000000;
            font-family: sans-serif;
            
            /* Center the card in the viewport */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            max-width: 600px;
            padding: 20px;
            -webkit-box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.41); 
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.41);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
      <h1 id="title">THIS CHANNEL IS ARCHIVED.</h1>
      <p id="text">THIS CHANNEL IS ARCHIVED. YOU NO LONGER HAVE THE ABILITY TO CHAT IN THIS ARCHIVED CHANNEL ANYMORE.</p>
    </div>

    <script>
    const translations = {
        'en-US': {
        title: 'THIS CHANNEL IS ARCHIVED.',
        text: 'THIS CHANNEL IS ARCHIVED. YOU NO LONGER HAVE THE ABILITY TO CHAT IN THIS ARCHIVED CHANNEL ANYMORE.'
        },
        'hwc-US-HI': {
        title: 'DIS CHANNEL IS ARCHIVED.',
        text: " 'DIS CHANNEL IS ARCHIVED. YOU NO MO' DA ABILITY FO' CHAT INSIDE DIS ARCHIVED CHANNEL ANYMO'. DASS IT!"
        },
        'pt-BR': {
        title: 'ESTE CANAL FOI ARQUIVADO.',
        text: 'ESTE CANAL FOI ARQUIVADO. VOCÊ NÃO TEM MAIS A HABILIDADE DE CHATEAR NESTE CANAL ARQUIVADO.'
        }
    };

    // Get locale from URL (e.g., /fil-PH/...)
    const pathParts = window.location.pathname.split('/');
    const locale = pathParts[1] || 'en-US'; // Default to en-US if empty

    // Apply translations if the locale exists
    if (translations[locale]) {
        document.getElementById('title').innerText = translations[locale].title;
        document.getElementById('text').innerText = translations[locale].text;
    }
    </script>

</body>
</html>
